[versions]

##################################################################################
# Misc libs
##################################################################################
appCompat = "1.2.0"
composeBoM = "2024.05.00"
lifecycle = "2.6.1"
activityCompose = "1.8.2"

##################################################################################
# Test libs
##################################################################################
testing = "13.+"


