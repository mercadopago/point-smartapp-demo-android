##################################################################################
# Misc libs
##################################################################################
misc-appCompat = { module ="androidx.appcompat:appcompat", version.ref = "appCompat" }
misc-composeBoM = { module = "androidx.compose:compose-bom", version.ref = "composeBoM" }
